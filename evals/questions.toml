# Questions for the retrieval benchmark: each entry names a corpus document, the question, and the
# source spans that answer it (or marks it unanswerable). The format and the authoring rules are in
# docs/superpowers/specs/2026-11-20-corpus-and-harness-design.md, section 3.3. Gold spans were typed
# from the rendered pages; page numbers are physical. A comment above a span records where pypdf's
# extraction differs from the page.

# Contract

[[question]]
id = "contract-01"
kind = "answerable"
text = "How long does a force majeure event have to go on before the Authority can terminate the contract?"
reference_answer = "The Authority may terminate once a Force Majeure Event has lasted continuously for more than 90 days."

[[question.gold]]
document = "contract"
page = 72
text = "if a Force Majeure Event endures for a continuous period of more than ninety (90) days"

[[question]]
id = "contract-02"
kind = "answerable"
text = "How much notice does the supplier have to give before replacing one of its key people?"
reference_answer = "At least 60 Working Days' notice, except in cases of death, unexpected ill health or a material breach of the person's employment contract."

[[question.gold]]
document = "contract"
page = 31
text = "except in the cases of death, unexpected ill health or a material breach of the Key Personnel's employment contract, this will mean at least 60 Working Days' notice"

[[question]]
id = "contract-03"
kind = "answerable"
text = "For how long must goods sold by the supplier stay free of defects?"
reference_answer = "The goods must remain free from material defects in design, materials and workmanship for 12 months after delivery."

[[question.gold]]
document = "contract"
page = 23
text = "the Supplier shall ensure that the Goods are free from material defects in design, materials and workmanship and remain so for 12 months after delivery"

[[question]]
id = "contract-04"
kind = "answerable"
text = "When is the supplier allowed to end the contract because the Authority has not paid?"
reference_answer = "When an undisputed sum above the agreed threshold is still unpaid 40 Working Days after the Authority receives the supplier's notice of non-payment."

[[question.gold]]
document = "contract"
page = 73
text = "such amount remains outstanding 40 Working Days after the receipt by the Authority of a notice of non-payment from the Supplier"

[[question]]
id = "contract-05"
kind = "answerable"
text = "If I send a notice under the contract by email, when does it count as served?"
reference_answer = "An emailed notice is deemed served at 9.00am on the first Working Day after it is sent."

[[question.gold]]
document = "contract"
page = 83
text = "Email 9.00am on the first Working Day after sending Dispatched as a pdf attachment to an e-mail to the correct e-mail address without any error message."

[[question]]
id = "contract-06"
kind = "answerable"
text = "What is the most the supplier can be liable for each year for damaging the Authority's premises or property?"
reference_answer = "Its liability is capped at £10 million per Contract Year, a bracketed figure the parties can adjust."

[[question.gold]]
document = "contract"
page = 58
text = "that is caused by Defaults of the Supplier occurring in each and any Contract Year shall in no event exceed [£10 million]"

