name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Keep in step with the uv_build range in pyproject.toml and the local toolchain.
  UV_VERSION: "0.9.17"
  # Keep in step with the node base image in frontend/Dockerfile.
  NODE_VERSION: "24.22.3"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      # The frontend-lint and frontend-typecheck hooks run the lockfile-pinned npm toolchain.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: uv sync --frozen
      - run: uv run --frozen pre-commit run --all-files

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run --frozen pytest

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: sourcehaven_admin
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sourcehaven_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOURCEHAVEN_TEST_ADMIN_URL: postgresql+psycopg://sourcehaven_admin:devpassword@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run --frozen pytest -m integration

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: bash scripts/check-package.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Python and uv are needed only to print the OpenAPI schema for gen:api.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check generated API types are up to date
        env:
          UV_FROZEN: "1"
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api-types.ts
